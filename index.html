<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <title>Sketch-A-Etch</title>
    <script src="script.js" defer=""></script>
    <link href="style.css" rel="stylesheet"/>
  </head>
  <body>
    <form id="dimensions">
      <label for="height">Height</label>
      <input id="height" type="text" value="1" placeholder="1"/>
      <label for="width">Width</label>
      <input id="width" type="text" value="1" placeholder="1"/>
      <button type="submit">Apply</button>
    </form>
    <button id="add-end-columns">Add End Columns</button>
    <button id="add-end-rows">Append Rows</button>
    <button id="add-start-columns">Add Start Columns</button>
    <button id="add-start-rows">Add Start Rows</button>
    
    <div id="board"></div>
  </body>
</html>
