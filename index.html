<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <title>Sketch-A-Etch</title>
    <script src="script.js" defer=""></script>
    <link href="style.css" rel="stylesheet"/>
  </head>
  <body>
    <form id="dimensions">
      <label for="height">Height</label>
      <input id="height" type="text" value="1" placeholder="1"/>
      <label for="width">Width</label>
      <input id="width" type="text" value="1" placeholder="1"/>
      <button type="submit">Apply</button>
    </form>
    
    <div class="controls">
      <button id="add-start-rows">Add Start Rows</button>
      <button id="add-end-rows">Add End Rows</button>
      <button id="add-start-columns">Add Start Columns</button>
      <button id="add-end-columns">Add End Columns</button>
      <button id="del-start-rows">Delete Start Rows</button>
      <button id="del-end-rows">Delete End Rows</button>
      <button id="del-start-columns">Delete Start Columns</button>
      <button id="del-end-columns">Delete End Columns</button>
    </div>
    
    <main>
      <div id="board"></div>
    </main>
  </body>
</html>
